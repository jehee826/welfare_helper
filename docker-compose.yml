services:
  backend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.back
    container_name: welfare-backend
    command: ["python", "-m", "BackEnd.startup"]
    env_file:
      - .env
    environment:
      DATABASE_MODE: supabase
      INGEST_ON_STARTUP: "false"
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      DB_HOST: postgres
      DB_PORT: 5432
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM: ${OLLAMA_LLM:-gemma3:4b}
      OLLAMA_EMBED: ${OLLAMA_EMBED:-bge-m3}
      RERANK_CACHE_DIR: /app/.reranker_cache
    ports:
      - "8000:8000"
    volumes:
      - ./BackEnd:/app/BackEnd
      - ./docs:/app/docs:ro
      - ./.reranker_cache:/app/.reranker_cache
    depends_on:
      ollama:
        condition: service_healthy
    restart: none

  ollama:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ollama
    container_name: welfare-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_PULL_MODELS: "${OLLAMA_LLM:-gemma3:4b} ${OLLAMA_EMBED:-bge-m3}"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ['CMD-SHELL', 'for model in $$OLLAMA_PULL_MODELS; do ollama show "$$model" >/dev/null 2>&1 || exit 1; done']
      start_period: 10m
      interval: 5s
      timeout: 5s
      retries: 3
    # GPU가 있는 하드웨어로 실행시 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: none

  postgres:
    profiles: ["local"]
    image: pgvector/pgvector:pg16
    container_name: welfare-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: none
