[project]
name = "welfare-helper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg2-binary",
    "httpx",
    "pydantic-settings",
    "langchain-core==1.6.13",
    "langchain-ollama==1.1.0",
    "kiwipiepy==0.24.1",
    "python-multipart==0.0.22",
]

[project.optional-dependencies]
reranker = [
    "onnxruntime==1.31.0",
    "tokenizers==0.23.3",
    "huggingface-hub==2.2.0",
    "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["BackEnd/tests"]

[tool.setuptools]
packages = []

[tool.vercel]
entrypoint = "BackEnd.main:app"
